<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V_M_Love ❤️</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    background: #020006;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
}
/* =====================================================
   КОСМОС
===================================================== */
.space {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 40%, #27001e 0%, #09000d 42%, #010005 100%);
}
.space::before {
    content: "";
    position: absolute;
    inset: -50%;
    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,160,220,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(190,120,255,.6) 0 1px, transparent 1.5px);
    background-size: 90px 100px, 150px 170px, 210px 190px;
    animation: starMove 45s linear infinite;
    opacity: .55;
}
.space::after {
    content: "";
    position: absolute;
    inset: -30%;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,0,130,.14), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(120,40,255,.13), transparent 28%);
    animation: nebulaMove 18s ease-in-out infinite alternate;
}
/* Двигающиеся сердечки */
.space-heart {
    position: absolute;
    width: 11px;
    height: 11px;
    background: #ff3d91;
    transform: rotate(45deg);
    opacity: .7;
    filter: drop-shadow(0 0 9px #ff3d91);
    animation: floatHeart linear infinite;
}
.space-heart::before,
.space-heart::after {
    content: "";
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: inherit;
}
.space-heart::before {
    left: -5.5px;
}
.space-heart::after {
    top: -5.5px;
}
.h1 { left: 8%;  top: 90%; animation-duration: 18s; animation-delay: -5s; transform: rotate(45deg) scale(.55); }
.h2 { left: 21%; top: 105%; animation-duration: 25s; animation-delay: -13s; transform: rotate(45deg) scale(.8); }
.h3 { left: 36%; top: 80%; animation-duration: 21s; animation-delay: -8s; transform: rotate(45deg) scale(.4); }
.h4 { left: 50%; top: 110%; animation-duration: 28s; animation-delay: -18s; transform: rotate(45deg) scale(.7); }
.h5 { left: 64%; top: 95%; animation-duration: 20s; animation-delay: -6s; transform: rotate(45deg) scale(.5); }
.h6 { left: 78%; top: 115%; animation-duration: 24s; animation-delay: -14s; transform: rotate(45deg) scale(.85); }
.h7 { left: 91%; top: 85%; animation-duration: 19s; animation-delay: -4s; transform: rotate(45deg) scale(.45); }
.h8 { left: 15%; top: 55%; animation-duration: 31s; animation-delay: -22s; transform: rotate(45deg) scale(.35); }
.h9 { left: 84%; top: 45%; animation-duration: 27s; animation-delay: -16s; transform: rotate(45deg) scale(.6); }
.h10 { left: 45%; top: 30%; animation-duration: 34s; animation-delay: -27s; transform: rotate(45deg) scale(.3); }
@keyframes starMove {
    from {
        transform: translate3d(0, 0, 0) rotate(0deg);
    }
    to {
        transform: translate3d(-60px, 80px, 0) rotate(2deg);
    }
}
@keyframes nebulaMove {
    from {
        transform: scale(1) translate(0, 0);
    }
    to {
        transform: scale(1.15) translate(30px, -20px);
    }
}
@keyframes floatHeart {
    0% {
        opacity: 0;
        transform: translateY(20vh) rotate(45deg) scale(.5);
    }
    10% {
        opacity: .8;
    }
    50% {
        margin-left: 35px;
    }
    90% {
        opacity: .6;
    }
    100% {
        opacity: 0;
        transform: translateY(-125vh) rotate(405deg) scale(.8);
    }
}
/* =====================================================
   ПЕРВЫЙ ЭКРАН
===================================================== */
.intro {
    height: 100vh;
    height: 100svh;
    min-height: 650px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.intro img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(.62);
    animation: introZoom 12s ease-in-out infinite alternate;
}
.intro::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.1),
            rgba(0,0,0,.15) 35%,
            rgba(0,0,0,.82) 100%
        );
}
.intro-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
    margin-top: 43vh;
}
.intro h1 {
    font-size: clamp(34px, 9vw, 58px);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -1.5px;
    text-shadow: 0 5px 35px rgba(0,0,0,.9);
}
.intro p {
    margin-top: 13px;
    font-size: 18px;
    opacity: .9;
}
@keyframes introZoom {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.06);
    }
}
/* =====================================================
   ПОДСКАЗКА
===================================================== */
.scroll-hint {
    position: absolute;
    z-index: 3;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    animation: hint 1.8s ease-in-out infinite;
}
.scroll-hint span {
    display: block;
    font-size: 14px;
    opacity: .75;
    margin-bottom: 7px;
}
.arrow {
    font-size: 31px;
}
@keyframes hint {
    0%,100% {
        transform: translate(-50%, 0);
    }
    50% {
        transform: translate(-50%, 9px);
    }
}
/* =====================================================
   СЕКЦИЯ СЕРДЦЕМ
===================================================== */
.heart-section {
    min-height: 100vh;
    min-height: 100svh;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            rgba(100,0,65,.45),
            rgba(8,0,12,.75) 55%,
            rgba(1,0,5,.95)
        );
}
.heart-title {
    position: relative;
    z-index: 20;
    font-size: clamp(22px, 6vw, 38px);
    font-weight: 800;
    text-align: center;
    margin-bottom: 50px;
    text-shadow:
        0 0 15px rgba(255,40,140,.7),
        0 0 35px rgba(255,40,140,.4);
}
.heart-button {
    position: relative;
    width: min(72vw, 330px);
    height: min(72vw, 330px);
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: heartbeat 1.25s infinite;
}
/* Основное сердце */
.heart,
.heart-piece {
    position: absolute;
    width: 52%;
    height: 52%;
    left: 24%;
    top: 25%;
    background: #ff176f;
    transform: rotate(-45deg);
    border-radius: 13px;
    box-shadow:
        0 0 25px rgba(255,23,111,.95),
        0 0 65px rgba(255,23,111,.65),
        0 0 130px rgba(255,23,111,.3);
}
.heart::before,
.heart::after,
.heart-piece::before,
.heart-piece::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: inherit;
    border-radius: 50%;
}
.heart::before,
.heart-piece::before {
    top: -50%;
    left: 0;
}
.heart::after,
.heart-piece::after {
    top: 0;
    left: 50%;
}
/* Осколки сердца */
.heart-piece {
    z-index: 5;
    opacity: 0;
}
.heart-piece.left {
    clip-path: polygon(
        0 0,
        50% 0,
        45% 18%,
        55% 33%,
        43% 51%,
        54% 70%,
        45% 100%,
        0 100%
    );
}
.heart-piece.right {
    clip-path: polygon(
        50% 0,
        100% 0,
        100% 100%,
        45% 100%,
        55% 70%,
        43% 51%,
        55% 33%,
        45% 18%
    );
}
/* Трещина */
.crack {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 12%;
    width: 6px;
    height: 76%;
    background: white;
    opacity: 0;
    transform:
        translateX(-50%)
        scaleY(0)
        rotate(3deg);
    clip-path: polygon(
        20% 0,
        100% 15%,
        42% 30%,
        85% 46%,
        30% 63%,
        72% 81%,
        15% 100%,
        0 86%,
        48% 64%,
        0 48%,
        55% 29%,
        0 13%
    );
    filter:
        drop-shadow(0 0 7px white)
        drop-shadow(0 0 16px #ff5aa7);
}
/* Вспышка */
.flash {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    transform: translate(-50%,-50%) scale(0);
    opacity: 0;
    z-index: 15;
    box-shadow:
        0 0 25px white,
        0 0 70px #ff5aa7,
        0 0 120px #ff176f;
}
/* Ударная волна */
.shockwave {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(255,110,180,.9);
    transform: translate(-50%,-50%) scale(.2);
    opacity: 0;
    z-index: 2;
}
/* Частицы */
.particles {
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
}
.particle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff5aa7;
    box-shadow: 0 0 12px #ff5aa7;
    opacity: 0;
}
/* =====================================================
   АНИМАЦИЯ РАЗБИВАНИЯ
===================================================== */
@keyframes heartbeat {
    0%,100% {
        transform: scale(1);
    }
    14% {
        transform: scale(1.13);
    }
    28% {
        transform: scale(1);
    }
    42% {
        transform: scale(1.08);
    }
    56% {
        transform: scale(1);
    }
}
.heart-button.broken {
    animation: none;
}
.heart-button.broken .heart {
    animation: heartExplosion 1s cubic-bezier(.16,1,.3,1) forwards;
}
.heart-button.broken .heart-piece {
    opacity: 1;
}
.heart-button.broken .heart-piece.left {
    animation: breakLeft 1.25s cubic-bezier(.16,1,.3,1) forwards;
}
.heart-button.broken .heart-piece.right {
    animation: breakRight 1.25s cubic-bezier(.16,1,.3,1) forwards;
}
.heart-button.broken .crack {
    animation: crackOpen .45s cubic-bezier(.16,1,.3,1) forwards;
}
.heart-button.broken .flash {
    animation: flash .65s ease-out forwards;
}
.heart-button.broken .shockwave {
    animation: shockwave .95s cubic-bezier(.16,1,.3,1) forwards;
}
.heart-button.broken .particle {
    animation: particleFly 1.1s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes heartExplosion {
    0% {
        opacity: 1;
        transform: rotate(-45deg) scale(1);
    }
    25% {
        transform: rotate(-45deg) scale(1.18);
    }
    45% {
        transform: rotate(-45deg) scale(1.03);
    }
    100% {
        opacity: 0;
        transform: rotate(-45deg) scale(.7);
    }
}
@keyframes breakLeft {
    0% {
        transform: rotate(-45deg) translate(0,0) scale(1);
    }
    25% {
        transform: rotate(-49deg) translate(-8px,-4px) scale(1.08);
    }
    100% {
        opacity: 0;
        transform: rotate(-65deg) translate(-115px,-25px) scale(.65);
    }
}
@keyframes breakRight {
    0% {
        transform: rotate(-45deg) translate(0,0) scale(1);
    }
    25% {
        transform: rotate(-41deg) translate(8px,4px) scale(1.08);
    }
    100% {
        opacity: 0;
        transform: rotate(-25deg) translate(115px,25px) scale(.65);
    }
}
@keyframes crackOpen {
    0% {
        opacity: 0;
        transform: translateX(-50%) scaleY(0);
    }
    40% {
        opacity: 1;
        transform: translateX(-50%) scaleY(1.15);
    }
    100% {
        opacity: 0;
        transform: translateX(-50%) scaleY(1);
    }
}
@keyframes flash {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(0);
    }
    25% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(2.5);
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(7);
    }
}
@keyframes shockwave {
    0% {
        opacity: .9;
        transform: translate(-50%,-50%) scale(.2);
    }
    70% {
        opacity: .35;
        transform: translate(-50%,-50%) scale(6);
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(8);
    }
}
.p1 { --x:-120px; --y:-115px; --d:.42s; }
.p2 { --x:125px; --y:-95px; --d:.48s; }
.p3 { --x:-145px; --y:-20px; --d:.55s; }
.p4 { --x:150px; --y:35px; --d:.62s; }
.p5 { --x:-100px; --y:105px; --d:.68s; }
.p6 { --x:105px; --y:120px; --d:.73s; }
.p7 { --x:-155px; --y:65px; --d:.79s; }
.p8 { --x:160px; --y:-50px; --d:.84s; }
@keyframes particleFly {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.3);
    }
    18% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.1);
    }
}
/* =====================================================
   ФОТО
===================================================== */
.photos {
    position: relative;
    padding: 45px 15px 80px;
    background: transparent;
}
.photo {
    width: 100%;
    max-width: 700px;
    margin: 0 auto 38px;
    opacity: 0;
    transform:
        translateY(55px)
        scale(.94);
    transition:
        opacity 1s cubic-bezier(.16,1,.3,1),
        transform 1s cubic-bezier(.16,1,.3,1);
}
.photo.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
}
.photo img,
.photo video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 22px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        0 0 40px rgba(255,20,110,.13);
}
.video-block {
    margin-top: 55px;
}
.video-block video {
    background: #000;
}
/* =====================================================
   ФИНАЛ
===================================================== */
.final {
    min-height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 70px 25px 110px;
}
.final h2 {
    font-size: clamp(38px, 10vw, 65px);
    line-height: 1.1;
    text-shadow:
        0 0 20px rgba(255,30,120,.8),
        0 0 55px rgba(255,30,120,.4);
    animation: finalGlow 3s ease-in-out infinite alternate;
}
@keyframes finalGlow {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.035);
    }
}
/* =====================================================
   МОБИЛЬНАЯ ОПТИМИЗАЦИЯ
===================================================== */
@media (max-width: 600px) {
    .intro h1 {
        font-size: 40px;
    }
    .intro-content {
        margin-top: 45vh;
    }
    .heart-title {
        margin-bottom: 40px;
    }
    .heart-button {
        width: 78vw;
        height: 78vw;
    }
    .photo {
        margin-bottom: 28px;
    }
}
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>
<body>
<!-- =====================================================
     КОСМИЧЕСКИЙ ФОН
===================================================== -->
<div class="space" aria-hidden="true">

    <i class="space-heart h9"></i>

</div>
<!-- =====================================================

===================================================== -->
<section class="intro">
    <!-- ШКОЛЬНОЕ ФОТО -->
    <img
        src="IMG_4765.jpeg"

        </span>

        </div>

<!-- =====================================================

<section
    class="heart-section"
    id="heartSection"
>
    <div class="heart-title">
        НАЖМИ НА СЕРДЕЧКО ❤️
    </div>

        class="heart-button"
        id="heartButton"
        aria-label="Нажми на сердечко"

<!-- =====================================================

<section
    class="photos"
    id="photos"
>
    <div class="photo">
        <img
            src="IMG_4759.jpeg"
            alt="Фото"

<section class="final">
    <div>
        <h2>
            I miss you🥺
        </h2>
    </div>
</section>
<script>
/* =====================================================
   РАЗБИВАНИЕ СЕРДЦА
===================================================== */
const heartButton =
    document.getElementById("heartButton");
const photosSection =
    document.getElementById("photos");
heartButton.addEventListener("click", () => {
    if (
        heartButton.classList.contains("broken")
    ) {
        return;
    }
    heartButton.classList.add("broken");
    /*
       После завершения основной анимации
       плавно переходим к фотографиям.
    */
    setTimeout(() => {
        photosSection.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }, 1050);
});
/* =====================================================
   ПОЯВЛЕНИЕ ФОТОГРАФИЙ
===================================================== */
const photos =
    document.querySelectorAll(".photo");
const observer =
    new IntersectionObserver(
        entries => {
            entries.forEach(entry => {
                if (
                    entry.isIntersecting
                ) {
                    entry.target.classList.add(
                        "visible"
                    );
                }
            });
        },
        {
            threshold: 0.12
        }
    );
photos.forEach(photo => {
    observer.observe(photo);
});
</script>
