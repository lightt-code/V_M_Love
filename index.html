<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V_M_Love ❤️</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    background: #050005;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
}
/* =========================
   ПЕРВЫЙ ЭКРАН
========================= */
.intro {
    height: 100vh;
    min-height: 100svh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #050005;
}
.intro img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
    filter: brightness(0.72);
}
.intro::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.65)
        );
}
.intro-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
    margin-top: 45vh;
}
.intro h1 {
    font-size: clamp(32px, 9vw, 58px);
    font-weight: 800;
    letter-spacing: -1px;
    text-shadow: 0 5px 30px rgba(0,0,0,0.8);
}
.intro p {
    margin-top: 10px;
    font-size: 17px;
    opacity: 0.9;
}
/* =========================
   ПОДСКАЗКА
========================= */
.scroll-hint {
    position: absolute;
    z-index: 3;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    animation:
        hintAppear 0.8s ease forwards,
        hintMove 1.5s ease-in-out infinite 1s;
    animation-delay: 0.5s, 1.3s;
}
.scroll-hint span {
    display: block;
    font-size: 14px;
    margin-bottom: 8px;
    opacity: 0.8;
}
.arrow {
    font-size: 28px;
}
/* =========================
   СЕРДЦЕ
========================= */
.heart-section {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(
            circle at center,
            #30001e 0%,
            #10000d 45%,
            #050005 100%
        );
}
.heart-title {
    font-size: clamp(22px, 6vw, 38px);
    font-weight: 800;
    margin-bottom: 55px;
    text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 0 25px rgba(255, 50, 130, 0.7);
}
.heart-button {
    width: min(72vw, 330px);
    height: min(72vw, 330px);
    position: relative;
    border: none;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: heartBeat 1.25s infinite;
}
.heart {
    position: absolute;
    width: 52%;
    height: 52%;
    left: 24%;
    top: 25%;
    background: #ff176f;
    transform: rotate(-45deg);
    border-radius: 12px;
    box-shadow:
        0 0 25px rgba(255, 23, 111, 0.8),
        0 0 70px rgba(255, 23, 111, 0.5),
        0 0 130px rgba(255, 23, 111, 0.25);
}
.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff176f;
    border-radius: 50%;
}
.heart::before {
    top: -50%;
    left: 0;
}
.heart::after {
    top: 0;
    left: 50%;
}
.heart-crack {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 18%;
    width: 7px;
    height: 65%;
    background: white;
    transform: translateX(-50%) rotate(12deg) scaleY(0);
    transform-origin: top;
    opacity: 0;
    box-shadow: 0 0 10px white;
}
.heart-button.broken {
    animation: none;
}
.heart-button.broken .heart {
    animation: heartBreak 0.65s forwards;
}
.heart-button.broken .heart-crack {
    opacity: 1;
    animation: crack 0.35s ease forwards;
}
/* =========================
   ФОТО
========================= */
.photos {
    padding: 35px 15px 80px;
    background:
        linear-gradient(
            to bottom,
            #050005,
            #12000e,
            #050005
        );
}
.photo {
    width: 100%;
    max-width: 700px;
    margin: 0 auto 35px;
    opacity: 0;
    transform: translateY(45px) scale(0.96);
    transition:
        opacity 0.9s ease,
        transform 0.9s ease;
}
.photo.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
}
.photo img,
.photo video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 20px;
    box-shadow:
        0 15px 50px rgba(0,0,0,0.6),
        0 0 35px rgba(255, 20, 110, 0.12);
}
.video-block {
    margin-top: 45px;
}
.video-block video {
    background: #000;
}
/* =========================
   ФИНАЛ
========================= */
.final {
    min-height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 50px 25px 100px;
}
.final h2 {
    font-size: clamp(32px, 9vw, 58px);
    line-height: 1.15;
    text-shadow:
        0 0 25px rgba(255, 30, 120, 0.7);
}
.final p {
    margin-top: 18px;
    font-size: 18px;
    opacity: 0.75;
}
/* =========================
   АНИМАЦИИ
========================= */
@keyframes hintAppear {
    from {
        opacity: 0;
        transform: translate(-50%, 15px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}
@keyframes hintMove {
    0%, 100% {
        transform: translate(-50%, 0);
    }
    50% {
        transform: translate(-50%, 10px);
    }
}
@keyframes heartBeat {
    0%,
    100% {
        transform: scale(1);
    }
    14% {
        transform: scale(1.12);
    }
    28% {
        transform: scale(1);
    }
    42% {
        transform: scale(1.08);
    }
    56% {
        transform: scale(1);
    }
}
@keyframes heartBreak {
    0% {
        opacity: 1;
        transform: rotate(-45deg) scale(1);
    }
    45% {
        opacity: 1;
        transform: rotate(-45deg) scale(1.15);
    }
    100% {
        opacity: 0;
        transform: rotate(-45deg) scale(0.25);
    }
}
@keyframes crack {
    from {
        transform: translateX(-50%) rotate(12deg) scaleY(0);
    }
    to {
        transform: translateX(-50%) rotate(12deg) scaleY(1);
    }
}
</style>
</head>
<body>
<!-- ПЕРВЫЙ ЭКРАН -->
<section class="intro">
    <img src="IMG_4759.jpeg" alt="Наша история">
    <div class="intro-content">
        <h1>Тут мы познакомились</h1>
        <p>и с этого всё началось ❤️</p>
    </div>
    <div class="scroll-hint">
        <span>промотай вниз</span>
        <div class="arrow">↓</div>
    </div>
</section>
<!-- СЕРДЦЕ -->
<section class="heart-section" id="heartSection">
    <div class="heart-title">
        НАЖМИ НА СЕРДЕЧКО ❤️
    </div>
    <button class="heart-button" id="heartButton" aria-label="Нажми на сердечко">
        <div class="heart"></div>
        <div class="heart-crack"></div>
    </button>
</section>
<!-- ФОТО И ВИДЕО -->
<section class="photos" id="photos">
    <div class="photo">
        <img src="IMG_4760.jpeg" alt="Фото 2">
    </div>
    <div class="photo">
        <img src="IMG_4761.jpeg" alt="Фото 3">
    </div>
    <div class="photo">
        <img src="IMG_4762.jpeg" alt="Фото 4">
    </div>
    <div class="photo">
        <img src="IMG_4763.jpeg" alt="Фото 5">
    </div>
    <div class="photo">
        <img src="IMG_4764.jpeg" alt="Фото 6">
    </div>
    <div class="photo">
        <img src="IMG_4765.jpeg" alt="Фото 7">
    </div>
    <div class="photo">
        <img src="IMG_4766.jpeg" alt="Фото 8">
    </div>
    <div class="photo">
        <img src="IMG_4767.jpeg" alt="Фото 9">
    </div>
    <!-- ВИДЕО -->
    <div class="photo video-block">
        <video
            src="7302470960745283816.mp4"
            controls
            playsinline
            preload="metadata">
        </video>
    </div>
</section>
<!-- ФИНАЛ -->
<section class="final">
    <div>
        <h2>Я люблю тебя ❤️</h2>
        <p>И это только начало нашей истории.</p>
    </div>
</section>
<script>
/* =========================
   СЕРДЦЕ
========================= */
const heartButton = document.getElementById("heartButton");
const photosSection = document.getElementById("photos");
heartButton.addEventListener("click", () => {
    if (heartButton.classList.contains("broken")) {
        return;
    }
    heartButton.classList.add("broken");
    setTimeout(() => {
        photosSection.scrollIntoView({
            behavior: "smooth"
        });
    }, 650);
});
/* =========================
   ПОЯВЛЕНИЕ ФОТО
========================= */
const photos = document.querySelectorAll(".photo");
const observer = new IntersectionObserver(
    entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
            }
        });
    },
    {
        threshold: 0.12
    }
);
photos.forEach(photo => {
    observer.observe(photo);
});
</script>
</body>
</html>
